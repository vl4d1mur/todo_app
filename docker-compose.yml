services:
  # Nginx
  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth_service
      - task_service
    restart: unless-stopped

  # Auth
  auth_service:
    build: ./auth_service
    container_name: auth_service
    env_file:
      - ./auth_service/config/.env.example
    ports:
      - "8091:8091"
      - "50051:50051"
    depends_on:
      migrate-auth:
        condition: service_completed_successfully
      redis-auth:
        condition: service_healthy
    restart: unless-stopped

  postgres-auth:
    image: postgres:16-alpine
    container_name: postgres-auth
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-auth:
    image: redis:7-alpine
    container_name: redis-auth
    ports:
      - "6379:6379"
    volumes:
      - redis_auth_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Task
  task_service:
    build: ./task_service
    container_name: task_service
    env_file:
      - ./task_service/config/.env.example
    ports:
      - "8090:8090"
    depends_on:
      migrate-tasks:
        condition: service_completed_successfully
      redis-tasks:
        condition: service_healthy
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
      auth_service:
        condition: service_started
    restart: unless-stopped

  postgres-tasks:
    image: postgres:16-alpine
    container_name: postgres-tasks
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: tasks
    ports:
      - "5433:5432"
    volumes:
      - postgres_tasks_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tasks"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis-tasks:
    image: redis:7-alpine
    container_name: redis-tasks
    ports:
      - "6380:6379"
    volumes:
      - redis_tasks_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifier_service:
    build: ./notifier_service
    container_name: notifier_service
    env_file:
      - ./notifier_service/config/.env.example
    ports:
      - "8092:8092"
    depends_on:
      mongo:
        condition: service_healthy
      nats:
        condition: service_healthy
      mailhog:
        condition: service_started
      auth_service:
        condition: service_started
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    restart: unless-stopped

  # Infr
  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  nats:
    image: nats:2-alpine
    container_name: nats
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["--http_port", "8222"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
 
  migrate-auth:
    build: ./auth_service
    container_name: migrate-auth
    command: goose -dir /app/migrations postgres "postgres://postgres:root@postgres-auth:5432/users" up
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: on-failure

  migrate-tasks:
    build: ./task_service
    container_name: migrate-tasks
    command: goose -dir /app/migrations postgres "postgres://postgres:root@postgres-tasks:5432/tasks" up
    depends_on:
      postgres-tasks:
        condition: service_healthy
    restart: on-failure

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  postgres_auth_data:
  postgres_tasks_data:
  redis_auth_data:
  redis_tasks_data:
  mongo_data:
  grafana_data:
