syntax = "proto3";

package auth;

option go_package = "auth_service/pkg/pb;pb";

service AuthService {
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc ActivateTelegram(ActivateTelegramRequest) returns (ActivateTelegramResponse);
  rpc GetUserContacts(GetUserContactsRequest) returns (GetUserContactsResponse);
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string error = 3;
}

message ActivateTelegramRequest {
  string code = 1;
  int64 chat_id = 2;
}

message ActivateTelegramResponse {
  bool success = 1;
  string error = 2;
}

message GetUserContactsRequest {
  string user_id = 1;
}

message GetUserContactsResponse {
  string email = 1;
  int64 telegram_chat_id = 2;
  bool has_telegram = 3;
  string error = 4;
}

